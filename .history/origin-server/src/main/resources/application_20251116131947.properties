# Enable SSL
# server.ssl.enabled=true
# Path to the keystore (classpath will resolve to src/main/resources)
# server.ssl.key-store=classpath:keystore.p12
# Keystore password
# server.ssl.key-store-password=changeit
# Keystore type
# server.ssl.key-store-type=PKCS12
# Key alias
# server.ssl.key-alias=origin-server
# (Optional) Change server port to 8443
server.port=8080