<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Tracker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --sidebar-bg: #16213e;
            --card-bg: #1f2a48;
            --accent: #e94560;
            --text: #f1f1f1;
            --text-muted: #888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item {
            padding: 15px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: rgba(233, 69, 96, 0.1);
            color: var(--accent);
        }

        .logout {
            margin-top: auto;
            color: #ff4444;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text);
            margin: 10px 0 0 0;
        }

        /* Charts Section */
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            height: 300px;
        }

        /* Tables & Lists */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
        }

        .badge {
            background-color: rgba(233, 69, 96, 0.2);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        /* Console Log */
        .console-log {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', monospace;
            padding: 15px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">🚀 P2P Tracker</div>
        <div class="menu-item active">Dashboard</div>
        <div class="menu-item">Network Map</div>
        <div class="menu-item">Settings</div>
        <div class="menu-item logout" onclick="logout()">Logout</div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="header">
            <h2>Overview</h2>
            <div class="badge">System Online</div>
        </div>

        <!-- KPI Cards -->
        <div class="stats-grid">
            <div class="card">
                <h3>Active Peers</h3>
                <div class="value" id="totalPeers">0</div>
            </div>
            <div class="card">
                <h3>Tracked Files</h3>
                <div class="value" id="totalFiles">0</div>
            </div>
            <div class="card">
                <h3>Traffic In</h3>
                <div class="value" id="trafficIn">0 <span style="font-size:1rem">MB/s</span></div>
            </div>
            <div class="card">
                <h3>Traffic Out</h3>
                <div class="value" id="trafficOut">0 <span style="font-size:1rem">MB/s</span></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-row">
            <div class="chart-container">
                <canvas id="trafficChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Active Nodes</h3>
                <div id="peers-list" style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px;">
                    <!-- Peer badges -->
                </div>
            </div>
        </div>

        <!-- Files Table -->
        <div class="card" style="margin-bottom: 30px;">
            <h3>Active Swarms</h3>
            <table id="files-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Seeders</th>
                        <th>Peers</th>
                        <th>Health</th>
                    </tr>
                </thead>
                <tbody id="files-body">
                    <!-- Data here -->
                </tbody>
            </table>
        </div>

        <!-- Live Console -->
        <div class="card">
            <h3>System Logs</h3>
            <div class="console-log" id="console-log">
                <!-- Logs here -->
            </div>
        </div>
    </div>

    <script>
        // Auth Check
        if (!localStorage.getItem('adminToken')) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
        }

        // Chart Setup
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Network Traffic (MB/s)',
                    data: [],
                    borderColor: '#e94560',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(233, 69, 96, 0.1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } },
                animation: { duration: 0 }
            }
        });

        // Fetch Real Data from Backend
        function fetchStats() {
            // Using /api/admin/stats to fetch live metrics
            fetch('/api/admin/stats')
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        console.warn("API Error:", data.error);
                        return; // Handle gracefully
                    }

                    // 1. Update KPIs
                    const totalPeers = data.totalPeers ?? 0;
                    const totalFiles = data.totalFiles ?? 0;
                    // Note: trafficIn/Out are mocked in Java backend currently, 
                    // but this FE structure is ready for real metrics.
                    const trafficIn = data.trafficIn ?? 0;
                    const trafficOut = data.trafficOut ?? 0;

                    document.getElementById('totalPeers').innerText = totalPeers;
                    document.getElementById('totalFiles').innerText = totalFiles;
                    document.getElementById('trafficIn').innerHTML = trafficIn + ' <span style="font-size:1rem">MB/s</span>';
                    document.getElementById('trafficOut').innerHTML = trafficOut + ' <span style="font-size:1rem">MB/s</span>';

                    // 2. Update Chart
                    const now = new Date().toLocaleTimeString();
                    trafficChart.data.labels.push(now);
                    trafficChart.data.datasets[0].data.push(trafficIn);

                    // Keep chart window fixed size (e.g., last 20 points)
                    if (trafficChart.data.labels.length > 20) {
                        trafficChart.data.labels.shift();
                        trafficChart.data.datasets[0].data.shift();
                    }
                    trafficChart.update();

                    // 3. Update Files Table
                    const fileBody = document.getElementById('files-body');
                    fileBody.innerHTML = '';
                    if (data.files && Array.isArray(data.files)) {
                        data.files.forEach(file => {
                            const seeders = file.seeders || 0;
                            const peerCount = file.peers ? file.peers.length : 0;

                            let health = 'Critical';
                            let color = '#ff4444';
                            if (seeders > 5) { health = 'Healthy'; color = '#00ff00'; }
                            else if (seeders > 0) { health = 'Stable'; color = '#ffff00'; }

                            const row = `<tr>
                                <td style="font-weight:bold; color:#fff">${file.name}</td>
                                <td>${seeders}</td>
                                <td>${peerCount}</td>
                                <td style="color: ${color}">● ${health}</td>
                            </tr>`;
                            fileBody.innerHTML += row;
                        });
                    } else {
                        fileBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#777">No active downloads</td></tr>';
                    }

                    // 4. Update Peers List (Active Nodes)
                    const peersList = document.getElementById('peers-list');
                    peersList.innerHTML = '';
                    if (data.activePeersList && Array.isArray(data.activePeersList)) {
                        data.activePeersList.forEach(peerStr => {
                            console.log("Peer:", peerStr);
                            peersList.innerHTML += `<div class="badge">💻 ${peerStr}</div>`;
                        });
                    } else {
                        peersList.innerHTML = '<div style="color:#777; font-size: 0.9rem;">No active peers</div>';
                    }

                    // 5. Update Logs
                    const logContainer = document.getElementById('console-log');
                    if (data.logs && Array.isArray(data.logs)) {
                        let logHtml = '';
                        // Reverse logs to show newest first
                        [...data.logs].reverse().forEach(log => {
                            logHtml += `<div class="log-entry">${log}</div>`;
                        });
                        logContainer.innerHTML = logHtml;
                    }
                })
                .catch(err => console.error("Failed to fetch stats (Is Tracker running?):", err));
        }

        // Poll API every 2 seconds
        setInterval(fetchStats, 2000);
        // Initial call
        fetchStats();
    </script>
</body>

</html>
